services:
  - type: web
    name: ganesh-portfolio
    runtime: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    staticPublishPath: out
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
